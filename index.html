<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeRil - Watch Anime Online</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #131c2b;
            --accent-color: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(11, 15, 23, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .nav-brand {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-brand span { color: var(--accent-color); }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #fff; }
        .search-container {
            position: relative;
        }
        .search-container input {
            background: #182230;
            border: 1px solid #2a3b52;
            padding: 8px 15px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 14px;
            width: 200px;
            transition: width 0.3s;
        }
        .search-container input:focus { width: 260px; border-color: var(--accent-color); }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 450px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
            margin-bottom: 30px;
        }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, var(--bg-color) 0%, rgba(11,15,23,0.4) 60%, rgba(11,15,23,0.8) 100%);
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }
        .hero-title {
            font-size: 36px;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .hero-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .play-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
        }
        .play-btn:hover { background-color: #f40612; transform: scale(1.05); }

        /* Content Grid */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px 40px 30px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
            position: relative;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .card-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .card-info {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-brand">Anime<span>Ril</span></div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="#" onclick="alert('Coming soon!')">Catalog</a>
            <a href="#" onclick="alert('Coming soon!')">Schedule</a>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search anime..." onkeypress="if(event.key==='Enter') searchAnime()">
            </div>
        </div>
    </nav>

    <!-- Hero Banner -->
    <div class="hero" id="heroBanner" style="background-image: url('');">
        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Loading...</h1>
            <p class="hero-desc" id="heroDesc">Please wait while we fetch the latest anime highlights.</p>
            <a href="#" id="heroLink" class="play-btn">▶ WATCH NOW</a>
        </div>
    </div>

    <div class="container">
        <div class="section-title">Trending Now</div>
        <div class="grid" id="animeGrid">
            <!-- Anime Cards -->
        </div>
    </div>

    <script>
        async function loadHome() {
            try {
                const res = await fetch('/api/home/recently-released');
                const data = await res.json();
                const items = data.anilist || [];
                
                if (items.length > 0) {
                    // تعيين أول أنمي كبانر رئيسي (Hero)
                    const hero = items[0];
                    document.getElementById('heroBanner').style.backgroundImage = `url('${hero.banner || hero.image}')`;
                    document.getElementById('heroTitle').innerText = hero.title;
                    document.getElementById('heroDesc').innerText = hero.description || 'No description available.';
                    document.getElementById('heroLink').href = `/watch.html?anilistId=${hero.id}`;

                    renderGrid(items);
                }
            } catch (err) {
                console.error('Error loading home:', err);
            }
        }

        async function searchAnime() {
            const query = document.getElementById('searchInput').value.trim();
            const grid = document.getElementById('animeGrid');
            if (!query) {
                loadHome();
                return;
            }
            try {
                grid.innerHTML = '<p style="color:#9ca3af">Searching...</p>';
                const res = await fetch(`/api/anime/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderGrid(data.results || []);
            } catch (err) {
                console.error('Search error:', err);
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';
            items.forEach(anime => {
                const card = document.createElement('a');
                // هنا ربطنا الضغط بحيث ينقلك مباشرة لصفحة العرض أو تفاصيل الأنمي بدون رسائل مزعجة
                card.className = 'card';
                card.href = `/watch.html?anilistId=${anime.id}`;
                
                card.innerHTML = `
                    <img src="${anime.image}" alt="${anime.title}" class="card-img" loading="lazy">
                    <div class="card-body">
                        <div class="card-title">${anime.title}</div>
                        <div class="card-info">
                            <span>${anime.format || 'TV'}</span>
                            <span>⭐ ${anime.score ? (anime.score/10).toFixed(1) : 'N/A'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        loadHome();
    </script>
</body>
</html>
